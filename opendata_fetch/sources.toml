# opendata-fetch source registry.
#
# Each [[source]] is a dataset opendata-fetch can download. Most are
# declarative: a slug, some metadata, and a list of files. `{var}` in a file's
# url/dest is filled from that source's `vars` table, so bumping a dataset to a
# new vintage is a one-line edit.
#
# To add a source: copy a block, change the slug/metadata/files, run
# `opendata-fetch fetch <slug>`. See CONTRIBUTING.md.
#
# min_bytes is an integrity floor: downloads smaller than this are rejected as
# truncated or as HTML error pages. Values are set well below the observed size
# so a normal file passes but a half-download or error page fails.

# --------------------------------------------------------------------------- #
[[source]]
slug = "01-nces-schools"
agency = "NCES (U.S. Dept. of Education)"
dataset = "Common Core of Data: school Directory, Characteristics, Membership, and EDGE geocodes"
doc = "docs/sources/01-nces-schools.md"
homepage = "https://nces.ed.gov/ccd/files.asp"
update_cadence = "annual (school year); bump `vintage` and the 6-digit release stamp in filenames"
vars = { vintage = "2425" }

  [[source.files]]
  url = "https://nces.ed.gov/ccd/Data/zip/ccd_sch_029_{vintage}_w_1a_073025.zip"
  dest = "ccd_sch_029_{vintage}_w_1a_073025.zip"
  min_bytes = 8_000_000

  [[source.files]]
  url = "https://nces.ed.gov/ccd/Data/zip/ccd_sch_129_{vintage}_w_1a_073025.zip"
  dest = "ccd_sch_129_{vintage}_w_1a_073025.zip"
  min_bytes = 3_000_000

  [[source.files]]
  url = "https://nces.ed.gov/ccd/Data/zip/ccd_sch_052_{vintage}_l_1a_073025.zip"
  dest = "ccd_sch_052_{vintage}_l_1a_073025.zip"
  min_bytes = 150_000_000

  [[source.files]]
  url = "https://nces.ed.gov/programs/edge/data/EDGE_GEOCODE_PUBLICSCH_{vintage}.zip"
  dest = "EDGE_GEOCODE_PUBLICSCH_{vintage}.zip"
  min_bytes = 20_000_000

